# wiring_manifest.yml — 「実装に対し配線が追随しているか」の宣言。
# scripts/verify-wiring.sh が読む。schema (constrained, 2-space indent):
#   rules:
#     - id: <一意なID>
#       when: "<glob: この変更があったら>"
#       require_one_of:        # この中のいずれかも変更されていること
#         - "<glob>"
#       reason: "<なぜ配線が要るか>"
#       smoke: "<任意: real entrypoint smoke コマンド (v1 は宣言のみ・未実行)>"
# glob: ** は任意階層、* は同一階層。配線が本当に不要な変更では
# .agent-evidence/wiring-waivers.txt に rule id を 1 行書いて理由を証跡化する。
#
# 注: 本マニフェストは ADR (ADR-0004/0006/0008/0016) の計画構成から先行記述している。
#     ソース未配置のため when glob が一致するまで各ルールは inert。
#     実モジュール確定時に path を実態へ合わせて更新すること。
rules:
  - id: api-wired-into-entrypoint
    when: "src/**/Api*.hs"
    require_one_of:
      - "app/Main.hs"
      - "src/**/Server*.hs"
    reason: "Servant API 型の追加/変更は、自前 HasServer 解釈系とエントリ (foreign export fetch) への登録が必要 (ADR-0004/0006)"
    smoke: "wrangler dev でルートに fetch して 200 を確認"
  - id: binding-type-matches-wrangler
    when: "src/**/Binding/**.hs"
    require_one_of:
      - "wrangler.toml"
      - "wrangler.jsonc"
    reason: "env バインディング (KV/R2/D1/Durable Objects/Queues/Service Bindings) の型追加は wrangler の binding 宣言と整合が必要 (ADR-0008/0015)"
  - id: non-fetch-entrypoint-exported
    when: "src/**/Entrypoint/**.hs"
    require_one_of:
      - "app/Main.hs"
    reason: "scheduled/queue/tail ハンドラは Main の foreign export javascript への登録が必要 (ADR-0016)"
