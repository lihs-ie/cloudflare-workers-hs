name: pr-gate

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *'

permissions:
  contents: read

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check test registration and tooling regressions
        run: |
          node scripts/testing/registration.mts --output artifacts/testing/registration.json
          node scripts/testing/internal-module-boundaries.mts manifest
          node scripts/testing/test-boundaries.mts
          node --test scripts/testing/test/*.policy.spec.mts
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
      - name: Scan dependencies changed by the pull request
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/testing/dependency-audit.mts --base-sha "$PR_BASE_SHA"
      - name: Scan locked dependencies on schedule
        if: github.event_name == 'schedule'
        run: node scripts/testing/dependency-audit.mts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-registration
          path: artifacts/testing/
          if-no-files-found: error

  build_and_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.1.0'
          cabal-update: false
      - id: cabal-cache-key
        name: Read pinned Cabal package index
        shell: bash
        run: |
          host_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal.project)"
          wasm_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal-wasm.project)"
          test -n "$host_index_state"
          test "$host_index_state" = "$wasm_index_state"
          printf 'index-state=%s\n' "$host_index_state" >> "$GITHUB_OUTPUT"
      - name: Initialize host Cabal configuration
        run: cabal user-config init
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - id: host-cabal-index-cache
        name: Restore host Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/packages
          key: cabal-index-host-${{ github.job }}-${{ runner.os }}-cabal-3.16.1.0-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: host-cabal-store-cache
        name: Restore host Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/store
          key: cabal-store-host-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-ghc-9.14.1-cabal-3.16.1.0-${{ hashFiles('cabal.project', '**/*.cabal') }}
      - name: Update host Cabal package index
        if: steps.host-cabal-index-cache.outputs.cache-hit != 'true'
        run: cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - id: wasm-cabal-index-cache
        name: Restore WASM Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/packages
          key: cabal-index-wasm-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: wasm-cabal-store-cache
        name: Restore WASM Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/store
          key: cabal-store-wasm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal-wasm.project', '**/*.cabal') }}
      - name: Update WASM Cabal package index
        if: steps.wasm-cabal-index-cache.outputs.cache-hit != 'true'
        run: nix develop --command wasm32-wasi-cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Typecheck test tooling and examples
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
      - name: HLint
        run: nix develop --command scripts/hlint
      - name: Testing tool regressions and coverage
        run: node scripts/testing/example-node-coverage.mts --tools-only
      - name: Host tests
        run: node scripts/testing/run.mts host
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - name: Internal modules are hidden from external consumers
        run: node scripts/testing/internal-module-boundaries.mts consumer
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - name: Servant differential tests
        if: success() || failure()
        run: node scripts/testing/run.mts conformance
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - name: Coverage evidence report
        if: success() || failure()
        run: |
          pnpm install --frozen-lockfile
          nix develop --command pnpm build:runtime-tests
          node scripts/testing/run.mts coverage --skip-runtime-build --report-only
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Broader generated input exploration
        if: github.event_name == 'schedule' && (success() || failure())
        run: |
          node scripts/testing/run.mts host --seed "$GITHUB_RUN_NUMBER" --examples 1000
          node scripts/testing/run.mts conformance --seed "$GITHUB_RUN_NUMBER" --examples 1000
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - name: Representative mutation checks
        if: github.event_name == 'schedule' && (success() || failure())
        run: node scripts/testing/mutations.mts --output artifacts/testing/mutations
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: host-test-evidence
          path: artifacts/testing/
          if-no-files-found: error

  integration_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WASM_BUILD_DIR: dist-newstyle-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.1.0'
          cabal-update: false
      - id: cabal-cache-key
        name: Read pinned Cabal package index
        shell: bash
        run: |
          host_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal.project)"
          wasm_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal-wasm.project)"
          test -n "$host_index_state"
          test "$host_index_state" = "$wasm_index_state"
          printf 'index-state=%s\n' "$host_index_state" >> "$GITHUB_OUTPUT"
      - name: Initialize host Cabal configuration
        run: cabal user-config init
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - id: host-cabal-index-cache
        name: Restore host Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/packages
          key: cabal-index-host-${{ github.job }}-${{ runner.os }}-cabal-3.16.1.0-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: host-cabal-store-cache
        name: Restore host Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/store
          key: cabal-store-host-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-ghc-9.14.1-cabal-3.16.1.0-${{ hashFiles('cabal.project', '**/*.cabal') }}
      - name: Update host Cabal package index
        if: steps.host-cabal-index-cache.outputs.cache-hit != 'true'
        run: cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - id: wasm-cabal-index-cache
        name: Restore WASM Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/packages
          key: cabal-index-wasm-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: wasm-cabal-store-cache
        name: Restore WASM Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/store
          key: cabal-store-wasm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal-wasm.project', '**/*.cabal') }}
      - name: Install locked JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Update WASM Cabal package index
        if: steps.wasm-cabal-index-cache.outputs.cache-hit != 'true'
        run: nix develop --command wasm32-wasi-cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: TypeScript runtime package checks
        run: pnpm --filter @cloudflare-workers-hs/runtime check
      - name: External Git runtime install at the checked-out SHA
        run: nix develop --command pnpm test:package
      - name: Real WASM integration including production entrypoint
        run: nix develop --command node scripts/testing/run.mts integration
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Production APIs through wrangler dev
        if: success() || failure()
        run: nix develop --command node scripts/testing/run.mts dev
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Production APIs through Docker and wrangler dev
        if: success() || failure()
        run: nix develop --command node scripts/testing/run.mts docker
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wasm-test-evidence
          path: |
            artifacts/testing/
            examples/url-shortener/test-artifacts/
          if-no-files-found: error

  state_model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WASM_BUILD_DIR: dist-newstyle-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.1.0'
          cabal-update: false
      - id: cabal-cache-key
        name: Read pinned Cabal package index
        shell: bash
        run: |
          host_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal.project)"
          wasm_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal-wasm.project)"
          test -n "$host_index_state"
          test "$host_index_state" = "$wasm_index_state"
          printf 'index-state=%s\n' "$host_index_state" >> "$GITHUB_OUTPUT"
      - name: Initialize host Cabal configuration
        run: cabal user-config init
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - id: host-cabal-index-cache
        name: Restore host Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/packages
          key: cabal-index-host-${{ github.job }}-${{ runner.os }}-cabal-3.16.1.0-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: host-cabal-store-cache
        name: Restore host Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/store
          key: cabal-store-host-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-ghc-9.14.1-cabal-3.16.1.0-${{ hashFiles('cabal.project', '**/*.cabal') }}
      - name: Update host Cabal package index
        if: steps.host-cabal-index-cache.outputs.cache-hit != 'true'
        run: cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - id: wasm-cabal-index-cache
        name: Restore WASM Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/packages
          key: cabal-index-wasm-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: wasm-cabal-store-cache
        name: Restore WASM Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/store
          key: cabal-store-wasm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal-wasm.project', '**/*.cabal') }}
      - name: Install locked JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Update WASM Cabal package index
        if: steps.wasm-cabal-index-cache.outputs.cache-hit != 'true'
        run: nix develop --command wasm32-wasi-cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Build runtime for state model
        run: nix develop --command pnpm build:runtime-tests
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Generated state model against real WASM
        run: node scripts/testing/run.mts model --examples 10 --skip-runtime-build
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - name: Broader state exploration
        if: github.event_name == 'schedule' && (success() || failure())
        run: node scripts/testing/run.mts model --seed "$GITHUB_RUN_NUMBER" --examples 100 --skip-runtime-build
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: state-model-evidence
          path: artifacts/testing/
          if-no-files-found: error

  summary:
    if: always()
    needs: [policy, build_and_tests, integration_smoke, state_model]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          POLICY: ${{ needs.policy.result }}
          HOST: ${{ needs.build_and_tests.result }}
          WASM: ${{ needs.integration_smoke.result }}
          MODEL: ${{ needs.state_model.result }}
        run: |
          printf 'registration=%s host=%s wasm=%s model=%s\n' "$POLICY" "$HOST" "$WASM" "$MODEL"
          test "$POLICY" = success
          test "$HOST" = success
          test "$WASM" = success
          test "$MODEL" = success
