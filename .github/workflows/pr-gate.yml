name: pr-gate

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *'

permissions:
  contents: read

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python test dependencies
        run: python3 -m pip install --requirement scripts/testing/requirements.txt
      - name: Check test registration and tooling regressions
        run: |
          python3 scripts/testing/registration.py --output artifacts/testing/registration.json
          python3 scripts/testing/internal-module-boundaries.py manifest
          python3 -m unittest discover -s scripts/testing/Support -p 'test_*.py'
          python3 scripts/testing/Support/mutation_checks.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-registration
          path: artifacts/testing/
          if-no-files-found: error

  build_and_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python test dependencies
        run: python3 -m pip install --requirement scripts/testing/requirements.txt
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.1.0'
          cabal-update: false
      - id: cabal-cache-key
        name: Read pinned Cabal package index
        shell: bash
        run: |
          host_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal.project)"
          wasm_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal-wasm.project)"
          test -n "$host_index_state"
          test "$host_index_state" = "$wasm_index_state"
          printf 'index-state=%s\n' "$host_index_state" >> "$GITHUB_OUTPUT"
      - name: Initialize host Cabal configuration
        run: cabal user-config init
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - id: host-cabal-index-cache
        name: Restore host Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/packages
          key: cabal-index-host-${{ github.job }}-${{ runner.os }}-cabal-3.16.1.0-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: host-cabal-store-cache
        name: Restore host Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/store
          key: cabal-store-host-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-ghc-9.14.1-cabal-3.16.1.0-${{ hashFiles('cabal.project', '**/*.cabal') }}
      - name: Update host Cabal package index
        if: steps.host-cabal-index-cache.outputs.cache-hit != 'true'
        run: cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1
      - id: wasm-cabal-index-cache
        name: Restore WASM Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/packages
          key: cabal-index-wasm-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: wasm-cabal-store-cache
        name: Restore WASM Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/store
          key: cabal-store-wasm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal-wasm.project', '**/*.cabal') }}
      - name: Update WASM Cabal package index
        if: steps.wasm-cabal-index-cache.outputs.cache-hit != 'true'
        run: nix develop --command wasm32-wasi-cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: HLint
        run: nix develop --command scripts/hlint
      - name: Coverage collector regressions
        run: python3 scripts/testing/Support/coverage_checks.py
      - name: Host tests
        run: python3 scripts/testing/run.py host
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - name: Internal modules are hidden from external consumers
        run: python3 scripts/testing/internal-module-boundaries.py consumer
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - name: Servant differential tests
        if: success() || failure()
        run: python3 scripts/testing/run.py conformance
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - name: Coverage evidence report
        if: success() || failure()
        run: |
          pnpm install --frozen-lockfile
          nix develop --command pnpm run --dir examples/quickstart build:runtime
          python3 scripts/testing/run.py coverage --skip-runtime-build --report-only
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Broader generated input exploration
        if: github.event_name == 'schedule' && (success() || failure())
        run: |
          python3 scripts/testing/run.py host --seed "$GITHUB_RUN_NUMBER" --examples 1000
          python3 scripts/testing/run.py conformance --seed "$GITHUB_RUN_NUMBER" --examples 1000
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - name: Representative mutation checks
        if: github.event_name == 'schedule' && (success() || failure())
        run: python3 scripts/testing/mutations.py --output artifacts/testing/mutations
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: host-test-evidence
          path: artifacts/testing/
          if-no-files-found: error

  integration_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WASM_BUILD_DIR: dist-newstyle-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python test dependencies
        run: python3 -m pip install --requirement scripts/testing/requirements.txt
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.1.0'
          cabal-update: false
      - id: cabal-cache-key
        name: Read pinned Cabal package index
        shell: bash
        run: |
          host_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal.project)"
          wasm_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal-wasm.project)"
          test -n "$host_index_state"
          test "$host_index_state" = "$wasm_index_state"
          printf 'index-state=%s\n' "$host_index_state" >> "$GITHUB_OUTPUT"
      - name: Initialize host Cabal configuration
        run: cabal user-config init
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - id: host-cabal-index-cache
        name: Restore host Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/packages
          key: cabal-index-host-${{ github.job }}-${{ runner.os }}-cabal-3.16.1.0-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: host-cabal-store-cache
        name: Restore host Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/store
          key: cabal-store-host-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-ghc-9.14.1-cabal-3.16.1.0-${{ hashFiles('cabal.project', '**/*.cabal') }}
      - name: Update host Cabal package index
        if: steps.host-cabal-index-cache.outputs.cache-hit != 'true'
        run: cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1
      - id: wasm-cabal-index-cache
        name: Restore WASM Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/packages
          key: cabal-index-wasm-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: wasm-cabal-store-cache
        name: Restore WASM Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/store
          key: cabal-store-wasm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal-wasm.project', '**/*.cabal') }}
      - name: Install locked JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Update WASM Cabal package index
        if: steps.wasm-cabal-index-cache.outputs.cache-hit != 'true'
        run: nix develop --command wasm32-wasi-cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Pinned Git runtime consumer
        run: nix develop --command pnpm test:package
      - name: Real WASM integration including production entrypoint
        run: nix develop --command python3 scripts/testing/run.py integration
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Production APIs through wrangler dev
        if: success() || failure()
        run: nix develop --command python3 scripts/testing/run.py dev
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Production APIs through Docker and wrangler dev
        if: success() || failure()
        run: nix develop --command python3 scripts/testing/run.py docker
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: wasm-test-evidence
          path: |
            artifacts/testing/
            examples/quickstart/test-artifacts/
          if-no-files-found: error

  state_model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WASM_BUILD_DIR: dist-newstyle-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python test dependencies
        run: python3 -m pip install --requirement scripts/testing/requirements.txt
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.1.0'
          cabal-update: false
      - id: cabal-cache-key
        name: Read pinned Cabal package index
        shell: bash
        run: |
          host_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal.project)"
          wasm_index_state="$(sed -nE 's/^index-state:[[:space:]]*(.+)$/\1/p' cabal-wasm.project)"
          test -n "$host_index_state"
          test "$host_index_state" = "$wasm_index_state"
          printf 'index-state=%s\n' "$host_index_state" >> "$GITHUB_OUTPUT"
      - name: Initialize host Cabal configuration
        run: cabal user-config init
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - id: host-cabal-index-cache
        name: Restore host Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/packages
          key: cabal-index-host-${{ github.job }}-${{ runner.os }}-cabal-3.16.1.0-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: host-cabal-store-cache
        name: Restore host Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-host/store
          key: cabal-store-host-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-ghc-9.14.1-cabal-3.16.1.0-${{ hashFiles('cabal.project', '**/*.cabal') }}
      - name: Update host Cabal package index
        if: steps.host-cabal-index-cache.outputs.cache-hit != 'true'
        run: cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1
      - id: wasm-cabal-index-cache
        name: Restore WASM Cabal package index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/packages
          key: cabal-index-wasm-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ steps.cabal-cache-key.outputs.index-state }}
      - id: wasm-cabal-store-cache
        name: Restore WASM Cabal dependency store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cabal-wasm/store
          key: cabal-store-wasm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'cabal-wasm.project', '**/*.cabal') }}
      - name: Install locked JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Update WASM Cabal package index
        if: steps.wasm-cabal-index-cache.outputs.cache-hit != 'true'
        run: nix develop --command wasm32-wasi-cabal update
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Build runtime for state model
        run: nix develop --command pnpm run --dir examples/quickstart build:runtime
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-wasm
      - name: Generated state model against real WASM
        run: python3 scripts/testing/run.py model --examples 10 --skip-runtime-build
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - name: Broader state exploration
        if: github.event_name == 'schedule' && (success() || failure())
        run: python3 scripts/testing/run.py model --seed "$GITHUB_RUN_NUMBER" --examples 100 --skip-runtime-build
        env:
          CABAL_DIR: ${{ runner.temp }}/cabal-host
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: state-model-evidence
          path: artifacts/testing/
          if-no-files-found: error

  summary:
    if: always()
    needs: [policy, build_and_tests, integration_smoke, state_model]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          POLICY: ${{ needs.policy.result }}
          HOST: ${{ needs.build_and_tests.result }}
          WASM: ${{ needs.integration_smoke.result }}
          MODEL: ${{ needs.state_model.result }}
        run: |
          printf 'registration=%s host=%s wasm=%s model=%s\n' "$POLICY" "$HOST" "$WASM" "$MODEL"
          test "$POLICY" = success
          test "$HOST" = success
          test "$WASM" = success
          test "$MODEL" = success
